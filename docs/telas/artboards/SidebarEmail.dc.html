<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sidebar, nível Email</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<aside style="display: flex; flex-direction: column; width: 224px; height: 740px; box-sizing: border-box; padding: 0 12px; background: #0a2a5e; color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 20px; -webkit-font-smoothing: antialiased; overflow: hidden">

<div style="flex: none; height: 52px; box-sizing: border-box; padding: 18px 0 0 6px">
<svg width="52" height="12" viewBox="0 0 52 12" aria-hidden="true" style="display: block"><circle cx="6" cy="6" r="6" fill="rgba(255,255,255,0.22)"></circle><circle cx="26" cy="6" r="6" fill="rgba(255,255,255,0.22)"></circle><circle cx="46" cy="6" r="6" fill="rgba(255,255,255,0.22)"></circle></svg>
</div>

<div style="flex: none; display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 8px">
<svg width="28" height="28" viewBox="0 0 100 100" role="img" aria-label="LAP" style="flex: none; display: block"><rect x="0" y="0" width="100" height="100" rx="6" fill="#ffffff"></rect><path d="M 20 25 L 20 75 L 55 75" fill="none" stroke="#0a2a5e" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"></path><rect x="62" y="58" width="22" height="22" fill="#3b82f6"></rect></svg>
<p style="margin: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 15px; line-height: 20px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap">LAP Reuniões</span>
<span style="font-size: 10px; line-height: 14px; font-weight: 500; letter-spacing: 0.14em; color: #a8b5cc; white-space: nowrap">LAP SOFTWARE</span>
</p>
</div>

<nav aria-label="Email" style="flex: 1 1 auto; min-height: 0; margin-top: 24px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<button type="button" aria-label="Email: voltar ao menu" style="flex: none; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #ffffff; font: inherit; font-size: 13px; font-weight: 500; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><path d="m15 18-6-6 6-6"></path></svg>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
<span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Email</span>
</button>
<div aria-hidden="true" style="flex: none; height: 6px"></div>

<button type="button" aria-expanded="true" style="flex: none; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #a8b5cc; font: inherit; font-size: 13px; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><path d="m6 9 6 6 6-6"></path></svg>
<span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">oi@lapsoftware.com.br</span>
</button>
<a href="Email.dc.html" aria-current="{{inboxCurrent}}" style="flex: none; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px 0 32px; border-radius: 4px; text-decoration: none; font-size: 13px; background: {{inboxBg}}; color: {{inboxFg}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
<span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Caixa de Entrada</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #ffffff; font-variant-numeric: tabular-nums">2</span>
</a>
<a href="Email.dc.html" aria-current="{{sentCurrent}}" style="flex: none; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px 0 32px; border-radius: 4px; text-decoration: none; font-size: 13px; background: {{sentBg}}; color: {{sentFg}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
<span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Enviados</span>
</a>

<button type="button" aria-expanded="false" style="flex: none; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #a8b5cc; font: inherit; font-size: 13px; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><path d="m9 18 6-6-6-6"></path></svg>
<span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">contato@lapsoftware.com.br</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 400; color: #ffffff; font-variant-numeric: tabular-nums">1</span>
</button>
</nav>

<div style="flex: none; display: flex; flex-direction: column; padding-top: 8px">
<button type="button" aria-keyshortcuts="Meta+Shift+L" style="display: flex; align-items: center; gap: 10px; height: 40px; margin-bottom: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #a8b5cc; font: inherit; font-size: 13px; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
<span style="flex: 1 1 auto">Bloquear</span>
<kbd aria-hidden="true" style="font-family: inherit; font-size: 12px; opacity: 0.8; font-variant-numeric: tabular-nums">⌘⇧L</kbd>
</button>
<section aria-label="Permissões" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 4px 20px; border-top: 1px solid rgba(255,255,255,0.12)">
<p style="margin: 0; font-size: 10px; line-height: 14px; font-weight: 500; letter-spacing: 0.14em; color: #a8b5cc">PERMISSÕES</p>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px">
<span aria-hidden="true" style="flex: none; width: 6px; height: 6px; background: #3b82f6"></span>
<span style="flex: 1 1 auto; min-width: 0">Microfone</span>
<span style="color: #a8b5cc; white-space: nowrap">concedido</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px">
<span aria-hidden="true" style="flex: none; width: 6px; height: 6px; background: #3b82f6"></span>
<span style="flex: 1 1 auto; min-width: 0">Áudio do sistema</span>
<span style="color: #a8b5cc; white-space: nowrap">ok</span>
</div>
</section>
</div>

</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pasta":{"editor":"enum","options":["inbox","enviados"],"default":"inbox"},"$preview":{"width":224,"height":740}}'>
class Component extends DCLogic {
  renderVals() {
    var inbox = (this.props.pasta ?? 'inbox') !== 'enviados';
    var on = { bg: 'rgba(255,255,255,0.12)', fg: '#ffffff' };
    var off = { bg: 'transparent', fg: '#a8b5cc' };
    var a = inbox ? on : off;
    var b = inbox ? off : on;
    return {
      inboxBg: a.bg, inboxFg: a.fg, inboxCurrent: inbox ? 'page' : undefined,
      sentBg: b.bg, sentFg: b.fg, sentCurrent: inbox ? undefined : 'page'
    };
  }
}
</script>
</body>
</html>
