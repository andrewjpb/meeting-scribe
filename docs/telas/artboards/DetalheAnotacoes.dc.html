<body>

<div style="flex: 0 0 224px; width: 224px; height: 740px">

</div>

<main style="flex: 1 1 0; min-width: 0; height: 740px; display: flex; flex-direction: column; overflow: hidden">
<div aria-hidden="true" style="flex: none; height: 52px"></div>

<header style="flex: none; padding: 24px 40px 0; border-bottom: 1px solid #e3e9f2">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 16px; padding-right: 4px; border-radius: 4px; font-size: 12px; line-height: 16px; color: #1e5bb8; text-decoration: none">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="display: block"><path d="m15 18-6-6 6-6"></path></svg>
Reuniões
</a>
<div style="margin-top: 6px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px">
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: #5b6b85; font-variant-numeric: tabular-nums">
<span>16 de novembro de 2026 · 16:00 · 52 min</span>
<span role="img" aria-label="Você e participantes" style="display: flex; align-items: center; gap: 4px"><span style="width: 6px; height: 6px; background: #1e5bb8"></span><span style="width: 6px; height: 6px; background: #5b6b85"></span></span>
<span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; background: #eef2f9; font-weight: 500">PT → EN</span>
<span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; background: #eef2f9; font-family: Menlo, ui-monospace, monospace; font-size: 11px">claude-cli:haiku</span>
</div>
<p style="margin: 0; font-size: 12px; line-height: 16px; color: #5b6b85">Da agenda: Google · 16:00 · Ana, Bruno, Carla, Diego, Elisa</p>
</div>
<div style="flex: none; display: flex; align-items: center; gap: 8px">
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 0; border-radius: 4px; background: transparent; color: #c62f34; font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer">Excluir</button>
</div>
</div>
<div style="margin-top: 16px">
<div role="tablist" aria-label="Conteúdo da reunião" style="display: flex; gap: 24px; margin-bottom: -1px">
<a href="DetalheResumo.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; height: 40px; box-sizing: border-box; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 500; color: #5b6b85; text-decoration: none">Resumo</a>
<a href="DetalheAnotacoes.dc.html" role="tab" aria-selected="true" style="display: flex; align-items: center; height: 40px; box-sizing: border-box; border-bottom: 2px solid #1e5bb8; font-size: 13px; font-weight: 500; color: #0a2a5e; text-decoration: none">Anotações</a>
<button type="button" role="tab" aria-selected="false" style="display: flex; align-items: center; height: 40px; box-sizing: border-box; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: #5b6b85; cursor: pointer">Assistente</button>
<a href="DetalheTranscricao.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; height: 40px; box-sizing: border-box; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 500; color: #5b6b85; text-decoration: none">Transcrição</a>
<a href="DetalheAudio.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; height: 40px; box-sizing: border-box; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 500; color: #5b6b85; text-decoration: none">Áudio</a>
</div>
</div>
</header>

<div class="sc" role="tabpanel" aria-label="Anotações" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 40px 40px">
<div style="margin: 0 auto; max-width: 1040px; padding-top: 28px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; box-sizing: border-box; padding: 0 14px; border: 1px solid #c9d4e5; border-radius: 4px; background: #ffffff; color: #0a2a5e; font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="display: block"><path d="M5 12h14M12 5v14"></path></svg>
Nova anotação
</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; box-sizing: border-box; padding: 0 14px; border: 1px solid #c9d4e5; border-radius: 4px; background: #ffffff; color: #0a2a5e; font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="display: block"><rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
Copiar anotações
</button>
<div role="group" aria-label="Filtrar anotações" style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; box-sizing: border-box; padding: 0 10px; border: 1px solid #c9d4e5; border-radius: 4px; background: #ffffff; color: #061a3d; font: inherit; font-size: 12px; white-space: nowrap; cursor: pointer">Abertas<span style="opacity: 0.7; font-variant-numeric: tabular-nums">3</span></button>
<button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; box-sizing: border-box; padding: 0 10px; border: 1px solid #c9d4e5; border-radius: 4px; background: #ffffff; color: #061a3d; font: inherit; font-size: 12px; white-space: nowrap; cursor: pointer">Resolvidas<span style="opacity: 0.7; font-variant-numeric: tabular-nums">1</span></button>
<button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; box-sizing: border-box; padding: 0 10px; border: 1px solid #0a2a5e; border-radius: 4px; background: #0a2a5e; color: #ffffff; font: inherit; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer">Todas<span style="opacity: 0.7; font-variant-numeric: tabular-nums">4</span></button>
</div>
</div>

<ul aria-label="Anotações" style="margin: 0; padding: 16px; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, 240px); align-content: start; align-items: start; gap: 16px; min-height: 560px; box-sizing: border-box; border: 1px dashed #e3e9f2; border-radius: 6px">
<sc-for list="{{notas}}" as="n" hint-placeholder-count="4">
<li style="transform: rotate({{n.inclinacao}}deg)">
<article aria-label="{{n.rotulo}}" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 6px; border: 1px solid {{n.borda}}; background: {{n.fundo}}; color: {{n.tinta}}; opacity: {{n.opacidade}}; cursor: grab">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 24px">
<button type="button" aria-label="Ir para {{n.tempo}} na transcrição" style="display: inline-flex; align-items: center; height: 24px; margin-left: -4px; padding: 0 4px; border: 0; border-radius: 4px; background: transparent; color: inherit; font: inherit; font-size: 12px; font-weight: 500; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; font-variant-numeric: tabular-nums; cursor: pointer">{{n.tempo}}</button>
<div style="display: flex; align-items: center; gap: 4px; margin-right: -4px">
<sc-if value="{{n.resolvida}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Reabrir anotação {{n.pos}}" style="display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px; border: 0; border-radius: 4px; background: transparent; color: inherit; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="display: block"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5"></path></svg>Reabrir</button>
</sc-if>
<sc-if value="{{n.aberta}}" hint-placeholder-val="{{true}}">
<button type="button" aria-label="Concluir anotação {{n.pos}}" style="display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px; border: 0; border-radius: 4px; background: transparent; color: inherit; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="display: block"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>Concluir</button>
</sc-if>
<button type="button" aria-label="Excluir anotação {{n.pos}}" style="display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px; border: 0; border-radius: 4px; background: transparent; color: inherit; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="display: block"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"></path></svg>Excluir</button>
</div>
</div>
<sc-if value="{{n.temTitulo}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 14px; line-height: 22px; font-weight: 600; text-wrap: pretty">{{n.titulo}}</p>
</sc-if>
<p style="margin: 0; min-height: 66px; font-size: 14px; line-height: 22px; text-wrap: pretty">{{n.texto}}</p>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div role="group" aria-label="Cor da anotação {{n.pos}}" style="display: flex; align-items: center; gap: 6px">
<sc-for list="{{n.cores}}" as="c" hint-placeholder-count="6">
<button type="button" aria-label="{{c.nome}}" aria-pressed="{{c.atual}}" style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; box-sizing: border-box; padding: 0; border-radius: 4px; border: 1px solid {{c.borda}}; background: {{c.fundo}}; color: inherit; cursor: pointer">
<sc-if value="{{c.atual}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="display: block"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
</button>
</sc-for>
</div>
<sc-if value="{{n.ia}}" hint-placeholder-val="{{false}}">
<span role="img" aria-label="Criada pela IA" title="Criada pela IA" style="display: inline-flex; opacity: 0.7"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="display: block"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0zM20 3v4M22 5h-4M4 17v2M5 18H3"></path></svg></span>
</sc-if>
</div>
<sc-if value="{{n.resolvida}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; display: flex; align-items: flex-start; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 500; text-wrap: pretty"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><path d="M20 6 9 17l-5-5"></path></svg><span>{{n.motivo}}</span></p>
</sc-if>
</article>
</li>
</sc-for>
</ul>

</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":740}}'>
class Component extends DCLogic {
  renderVals() {
    var paleta = [
      { id: 'yellow', nome: 'Amarela', fundo: '#fff4c2', borda: '#e3c95a', tinta: '#4a3b00' },
      { id: 'pink', nome: 'Rosa', fundo: '#fce1ec', borda: '#e2a3bd', tinta: '#5c1a35' },
      { id: 'green', nome: 'Verde', fundo: '#ddf3e1', borda: '#95caa1', tinta: '#173f22' },
      { id: 'blue', nome: 'Azul', fundo: '#dceafb', borda: '#98bbe8', tinta: '#0e2f5c' },
      { id: 'purple', nome: 'Roxa', fundo: '#eae1f8', borda: '#b7a1de', tinta: '#33205a' },
      { id: 'orange', nome: 'Laranja', fundo: '#ffe6d1', borda: '#eeb083', tinta: '#5a2a06' }
    ];
    function nota(pos, cor, tempo, inclinacao, titulo, texto, ia, motivo) {
      var p = paleta.filter(function (c) { return c.id === cor; })[0];
      var resolvida = !!motivo;
      return {
        pos: pos, tempo: tempo, inclinacao: inclinacao, titulo: titulo, temTitulo: !!titulo, texto: texto, ia: ia,
        resolvida: resolvida, aberta: !resolvida, motivo: motivo ? 'Resolvida — ' + motivo : '',
        rotulo: 'Anotação ' + pos + ' de ' + tempo + (resolvida ? ', resolvida' : ''),
        opacidade: resolvida ? 0.62 : 1,
        fundo: p.fundo, borda: p.borda, tinta: p.tinta,
        cores: paleta.map(function (c) {
          var atual = c.id === cor;
          return { nome: c.nome, fundo: c.fundo, borda: atual ? p.tinta : c.borda, atual: atual };
        })
      };
    }
    var notas = [
      nota(1, 'yellow', '08:12', -1.2, '', 'O app do cliente vai para a loja no fim de fevereiro.', false, ''),
      nota(2, 'blue', '21:40', 0.8, 'Painel de vendas', 'Depende da lista de relatórios do financeiro. Bruno estima depois de receber.', true, ''),
      nota(3, 'green', '34:05', -0.4, '', 'Migração em janeiro, fora do horário comercial. Falta fechar a semana.', false, ''),
      nota(4, 'pink', '47:30', 1.6, '', 'Pedir à Carla a lista de relatórios do financeiro.', false, 'Carla mandou por email.')
    ];
    return { duas: 3, notas: notas };
  }
}
</script>
</body>
