<x-dc>
<helmet>

<div style="display: flex; width: 1120px; height: 740px; overflow: hidden; background: #ffffff; color: #061a3d; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 20px; -webkit-font-smoothing: antialiased">

<div style="flex: 0 0 224px; width: 224px; height: 740px">

<div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 20px 32px 32px">

<span style="flex: none; font-size: 10px; line-height: 14px; font-weight: 500; letter-spacing: 0.14em; color: #1e5bb8">VOCÊ<span style="margin-left: 6px; letter-spacing: normal; color: #7f8da6">sem sinal</span></span>
<svg height="1" aria-hidden="true" style="flex: 1 1 auto; min-width: 0; display: block"><line x1="0" x2="100%" y1="0.5" y2="0.5" stroke="#c9d4e5" stroke-width="1" stroke-dasharray="6 6"></line></svg>
</div>
<div style="height: 1px; background: #c9d4e5"></div>
<div style="display: flex; align-items: center; gap: 12px; height: 36px">

<svg height="1" aria-hidden="true" style="flex: 1 1 auto; min-width: 0; display: block"><line x1="0" x2="100%" y1="0.5" y2="0.5" stroke="#c9d4e5" stroke-width="1" stroke-dasharray="6 6"></line></svg>

</div>

<div style="margin-top: 16px">
<a href="GravacaoAnalise.dc.html" aria-keyshortcuts="Meta+N" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 4px; background: #1e5bb8; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><path d="M5 12h14M12 5v14"></path></svg>
<span>Nova gravação</span>
<kbd aria-hidden="true" style="font-family: inherit; font-size: 12px; font-weight: 400; opacity: 0.8">⌘N</kbd>

<div aria-hidden="true" style="flex: 7 1 0"></div>
