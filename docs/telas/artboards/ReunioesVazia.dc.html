<!doctype html>
<!-- densidade: adensar.mjs -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reuniões, estado vazio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; width: 1120px; height: 740px; overflow: hidden; background: #ffffff; color: #061a3d; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 20px; -webkit-font-smoothing: antialiased">

<div style="flex: 0 0 224px; width: 224px; height: 740px">
<dc-import name="SidebarRaiz" ativo="reunioes" nao-lidas="{{duas}}" hint-size="224px,740px"></dc-import>
</div>

<main style="flex: 1 1 0; min-width: 0; height: 740px; display: flex; flex-direction: column; overflow: hidden">

<div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 20px 32px 32px">
<header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<h1 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -0.3px; color: #0a2a5e">Reuniões</h1>
</header>

<div aria-hidden="true" style="flex: 3 1 0"></div>

<section aria-label="Nenhuma reunião ainda" style="flex: none; display: flex; flex-direction: column; align-items: center; text-align: center">
<div style="margin-bottom: 20px">
<svg width="320" height="80" viewBox="0 0 320 80" aria-hidden="true" style="display: block">
<sc-for list="{{micBars}}" as="b" hint-placeholder-count="0"><rect x="{{b.x}}" y="{{b.y}}" width="3" height="{{b.h}}" fill="#1e5bb8"></rect></sc-for>
<sc-for list="{{sysBars}}" as="b" hint-placeholder-count="0"><rect x="{{b.x}}" y="41" width="3" height="{{b.h}}" fill="#5b6b85"></rect></sc-for>
<rect x="0" y="40" width="320" height="1" fill="#c9d4e5"></rect>
</svg>
</div>
<h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; color: #0a2a5e">Nenhuma reunião ainda</h2>
<p style="margin: 8px 0 0; max-width: 400px; font-size: 13px; line-height: 20px; color: #5b6b85; text-wrap: pretty">As gravações ficam neste Mac e aparecem aqui, da mais recente para a mais antiga.</p>
<div style="margin-top: 16px">
<a href="GravacaoAnalise.dc.html" aria-keyshortcuts="Meta+N" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 4px; background: #1e5bb8; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><path d="M5 12h14M12 5v14"></path></svg>
<span>Nova gravação</span>
<kbd aria-hidden="true" style="font-family: inherit; font-size: 12px; font-weight: 400; opacity: 0.8">⌘N</kbd>
</a>
</div>
</section>

<div aria-hidden="true" style="flex: 7 1 0"></div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":740}}'>
class Component extends DCLogic {
  renderVals() {
    var seed = 11;
    function noise() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    var mic = [], sys = [];
    for (var i = 0; i < 80; i++) {
      var x = i * 4;
      var micOn = (i > 6 && i < 28) || (i > 54 && i < 70);
      var sysOn = (i > 30 && i < 52) || i > 72;
      var m = micOn ? Math.round(5 + noise() * 28) : 0;
      var s = sysOn ? Math.round(5 + noise() * 28) : 0;
      if (m > 0) mic.push({ x: x, h: m, y: 40 - m });
      if (s > 0) sys.push({ x: x, h: s });
    }
    return { duas: 3, micBars: mic, sysBars: sys };
  }
}
</script>
</body>
</html>
