<!doctype html>
<!-- densidade: adensar.mjs -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sidebar, nível Configurações</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<aside style="display: flex; flex-direction: column; width: 224px; height: 740px; box-sizing: border-box; padding: 0 12px; background: #0a2a5e; color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 20px; -webkit-font-smoothing: antialiased; overflow: hidden">

<div style="flex: none; height: 52px; box-sizing: border-box; padding: 18px 0 0 6px">
<svg width="52" height="12" viewBox="0 0 52 12" aria-hidden="true" style="display: block"><circle cx="6" cy="6" r="6" fill="rgba(255,255,255,0.22)"></circle><circle cx="26" cy="6" r="6" fill="rgba(255,255,255,0.22)"></circle><circle cx="46" cy="6" r="6" fill="rgba(255,255,255,0.22)"></circle></svg>
</div>

<div style="flex: none; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px">
<svg width="28" height="28" viewBox="0 0 100 100" role="img" aria-label="LAP" style="flex: none; display: block"><rect x="0" y="0" width="100" height="100" rx="6" fill="#ffffff"></rect><path d="M 20 25 L 20 75 L 55 75" fill="none" stroke="#0a2a5e" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"></path><rect x="62" y="58" width="22" height="22" fill="#3b82f6"></rect></svg>
<p style="margin: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 15px; line-height: 20px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap">LAP Reuniões</span>
<span style="font-size: 10px; line-height: 14px; font-weight: 500; letter-spacing: 0.14em; color: #a8b5cc; white-space: nowrap">LAP SOFTWARE</span>
</p>
</div>

<nav aria-label="Configurações" style="flex: 1 1 auto; min-height: 0; margin-top: 16px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<button type="button" aria-label="Configurações: voltar ao menu" style="flex: none; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #ffffff; font: inherit; font-size: 13px; font-weight: 500; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><path d="m15 18-6-6 6-6"></path></svg>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
<span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Configurações</span>
</button>
<div aria-hidden="true" style="flex: none; height: 2px"></div>
<sc-for list="{{abas}}" as="aba" hint-placeholder-count="9">
<a href="{{aba.href}}" aria-current="{{aba.current}}" aria-keyshortcuts="{{aba.tecla}}" style="flex: none; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px 0 28px; border-radius: 4px; text-decoration: none; font-size: 13px; background: {{aba.bg}}; color: {{aba.fg}}">
<span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{aba.rotulo}}</span>
<kbd aria-hidden="true" style="font-family: inherit; font-size: 11px; line-height: 16px; font-weight: 400; color: #a8b5cc; font-variant-numeric: tabular-nums">{{aba.atalho}}</kbd>
</a>
</sc-for>
</nav>

<div style="flex: none; display: flex; flex-direction: column; margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.2)">
<div style="display: flex; margin-bottom: 4px">
<button type="button" aria-keyshortcuts="Meta+Shift+L" style="flex: 1 1 auto; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #a8b5cc; font: inherit; font-size: 13px; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; display: block"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
<span style="flex: 1 1 auto">Bloquear</span>
<kbd aria-hidden="true" style="font-family: inherit; font-size: 12px; opacity: 0.8; font-variant-numeric: tabular-nums">⌘⇧L</kbd>
</button>
</div>
<section aria-label="Permissões" style="display: flex; flex-direction: column; padding: 4px; border-top: 1px solid rgba(255,255,255,0.12)">
<p style="margin: 0; padding-top: 4px; font-size: 11px; line-height: 16px; font-weight: 500; color: #a8b5cc">Permissões</p>
<div style="display: flex; align-items: center; gap: 8px; height: 28px; font-size: 12px; line-height: 16px">
<span aria-hidden="true" style="flex: none; width: 6px; height: 6px; background: #3b82f6"></span>
<span style="flex: 1 1 auto; min-width: 0; white-space: nowrap">Microfone</span>
<span style="color: #a8b5cc; white-space: nowrap">concedido</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; height: 28px; font-size: 12px; line-height: 16px">
<span aria-hidden="true" style="flex: none; width: 6px; height: 6px; background: #3b82f6"></span>
<span style="flex: 1 1 auto; min-width: 0; white-space: nowrap">Áudio do sistema</span>
<span style="color: #a8b5cc; white-space: nowrap">ok</span>
</div>
</section>
</div>

</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"aba":{"editor":"enum","options":["geral","gravacao","claude","arquivos","contas","email","plugins","conexoes","sobre"],"default":"geral"},"$preview":{"width":224,"height":740}}'>
class Component extends DCLogic {
  renderVals() {
    var aberta = this.props.aba ?? 'geral';
    var base = [
      { id: 'geral', rotulo: 'Geral', href: 'ConfigGeral.dc.html' },
      { id: 'gravacao', rotulo: 'Gravação', href: 'ConfigGravacao.dc.html' },
      { id: 'claude', rotulo: 'Claude', href: 'ConfigClaude.dc.html' },
      { id: 'arquivos', rotulo: 'Arquivos', href: 'ConfigArquivos.dc.html' },
      { id: 'contas', rotulo: 'Contas', href: 'ConfigContas.dc.html' },
      { id: 'email', rotulo: 'Email', href: 'ConfigEmail.dc.html' },
      { id: 'plugins', rotulo: 'Plugins', href: 'ConfigPlugins.dc.html' },
      { id: 'conexoes', rotulo: 'Conexões', href: 'ConfigConexoes.dc.html' },
      { id: 'sobre', rotulo: 'Sobre', href: 'ConfigSobre.dc.html' }
    ];
    var abas = base.map(function (aba, i) {
      var on = aba.id === aberta;
      return {
        rotulo: aba.rotulo,
        href: aba.href,
        atalho: '⌘' + (i + 1),
        tecla: 'Meta+' + (i + 1),
        current: on ? 'page' : undefined,
        bg: on ? 'rgba(255,255,255,0.12)' : 'transparent',
        fg: on ? '#ffffff' : '#a8b5cc'
      };
    });
    return { abas: abas };
  }
}
</script>
</body>
</html>
