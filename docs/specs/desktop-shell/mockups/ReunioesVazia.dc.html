<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
var seed = 11;
function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
var mic = [], sys = [];
for (var i = 0; i < 80; i++) {
var x = i * 4;
var micOn = (i > 6 && i < 28) || (i > 54 && i < 70);
var sysOn = (i > 30 && i < 52) || i > 72;
if (micOn) { var m = Math.round(5 + rnd() * 28); mic.push({ x: x, h: m, y: 40 - m }); }
if (sysOn) { var s = Math.round(5 + rnd() * 28); sys.push({ x: x, h: s }); }
}
return { micBars: mic, sysBars: sys };
}
}
</script>
